# =============================================
# SENTINEL-SDK v2.0 — Application Configuration
# =============================================
spring.application.name=sentinel-sdk
server.port=8090
spring.profiles.active=groq

# ── Database ──────────────────────────────────
spring.datasource.url=jdbc:mysql://localhost:3306/sentinel_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ── Sentinel Agent ────────────────────────────
sentinel.agent.max-retries=3
sentinel.agent.request-timeout-seconds=30
sentinel.agent.concurrent-agents=4
sentinel.target.base-url=http://localhost:8080
sentinel.target.openapi-path=/v3/api-docs

# ── GitHub Integration ────────────────────────
sentinel.github.token=${GITHUB_TOKEN:}
sentinel.github.owner=${GITHUB_OWNER:}
sentinel.github.repo=${GITHUB_REPO:}
sentinel.github.base-branch=main

# ── Report Generation ─────────────────────────
sentinel.report.output-dir=./generated-tests
sentinel.report.junit-package=com.generated.tests

# ── Scheduler ─────────────────────────────────
sentinel.scheduler.enabled=true
sentinel.scheduler.interval-ms=3600000
sentinel.scheduler.max-concurrent-scheduled=2

# ── Actuator ──────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ── OpenAPI (Sentinel's own docs) ─────────────
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ── Logging ───────────────────────────────────
logging.level.com.sentinel=DEBUG
logging.level.org.springframework.ai=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %highlight(%-5level) %cyan(%logger{30}) - %msg%n

# ── AI Provider (switch between Groq/OpenAI with no code change) ─────────────
# FREE (Groq):   Set GROQ_API_KEY + use -Dspring.profiles.active=groq
# PAID (OpenAI): Set OPENAI_API_KEY (default profile)
spring.ai.openai.base-url=${AI_BASE_URL:https://api.openai.com}
spring.ai.openai.api-key=${OPENAI_API_KEY:${GROQ_API_KEY:sk-placeholder}}
spring.ai.openai.chat.options.model=${AI_MODEL:gpt-4o-mini}
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.max-tokens=4096

# ── Per-call model routing ────────────────────
sentinel.ai.plan-model=${AI_MODEL:gpt-4o-mini}
sentinel.ai.generate-model=${AI_MODEL:gpt-4o-mini}
sentinel.ai.fallback-model=${AI_FALLBACK_MODEL:gpt-4o-mini}

# ── Token budgets ─────────────────────────────
sentinel.ai.tokens.plan-max=1200
sentinel.ai.tokens.correction-max=800
sentinel.ai.tokens.test-gen-max=3000
sentinel.ai.tokens.spec-max-chars=8000

# ── Rate limit adaptive retry ─────────────────
sentinel.ai.rate-limit.enabled=true
sentinel.ai.rate-limit.initial-retry-ms=1000
sentinel.ai.rate-limit.max-retries=4
sentinel.ai.rate-limit.backoff-multiplier=2.0
sentinel.ai.rate-limit.payload-reduction-steps=3000,2000,1000,500
