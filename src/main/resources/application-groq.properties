
spring.ai.openai.base-url=${GROQ_URL:https://api.groq.com/openai}
spring.ai.openai.api-key=${GROQ_API_KEY}

# ── Model selection ───────────────────────────
sentinel.ai.plan-model=llama-3.1-8b-instant
sentinel.ai.generate-model=llama-3.3-70b-versatile
sentinel.ai.fallback-model=gemma2-9b-it

spring.ai.openai.chat.options.model=llama-3.1-8b-instant
spring.ai.openai.chat.options.temperature=0.1
spring.ai.openai.chat.options.max-tokens=4096

# ── Rate limit handling ───────────────────────
sentinel.ai.rate-limit.enabled=true
sentinel.ai.rate-limit.initial-retry-ms=2000
sentinel.ai.rate-limit.max-retries=4
sentinel.ai.rate-limit.backoff-multiplier=2.0
# Payload reduction steps on 429 (tokens to cut each retry)
sentinel.ai.rate-limit.payload-reduction-steps=3000,2000,1000,500

# ── Token budgets (optimized prompts) ─────────
sentinel.ai.tokens.plan-max=1200
sentinel.ai.tokens.correction-max=800
sentinel.ai.tokens.test-gen-max=3000
sentinel.ai.tokens.spec-max-chars=6000

spring.datasource.url=jdbc:mysql://localhost:3306/sentinel_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=${DATABASE_PASSWORD:your_password}

logging.level.com.sentinel=INFO
logging.level.com.sentinel.ai=DEBUG
