# =============================================
# SENTINEL-SDK — Production Configuration
# Used on Render.com / any cloud deployment
# All sensitive values via environment variables
# =============================================

# ── Database (Neon.tech PostgreSQL) ──────────
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Spring AI ─────────────────────────────────
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.ai.openai.chat.options.temperature=0.1

# ── GitHub ────────────────────────────────────
sentinel.github.token=${GITHUB_TOKEN}
sentinel.github.owner=${GITHUB_OWNER}
sentinel.github.repo=${GITHUB_REPO}
sentinel.github.base-branch=${GITHUB_BASE_BRANCH:main}

# ── Agent ─────────────────────────────────────
sentinel.agent.max-retries=5
sentinel.agent.concurrent-agents=2
sentinel.agent.request-timeout-seconds=20

# ── Scheduler ─────────────────────────────────
sentinel.scheduler.enabled=${SCHEDULER_ENABLED:true}
sentinel.scheduler.interval-ms=3600000
sentinel.scheduler.max-concurrent-scheduled=2

# ── Report output ─────────────────────────────
sentinel.report.output-dir=/tmp/sentinel-tests

# ── Server ────────────────────────────────────
server.port=${PORT:8090}

# ── Actuator ──────────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ── Logging ───────────────────────────────────
logging.level.com.sentinel=INFO
logging.level.org.springframework.ai=WARN
logging.level.org.hibernate=WARN
